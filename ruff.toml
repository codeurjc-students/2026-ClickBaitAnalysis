# Configuración de ruff (linter + formateador).
#
# El conjunto de reglas se declara EXPLÍCITAMENTE en vez de heredar el de por
# defecto: ruff lo amplía entre versiones, y con los defaults una actualización
# de la herramienta rompería el CI sin que cambiara una línea de código.

exclude = ["spikes", ".venv", "data"]

# Sin esto ruff supone una versión antigua y da por indefinidos incorporados que
# sí existen: `ExceptionGroup` y `BaseExceptionGroup` llegaron en 3.11, y el
# código usa además `except*` y `asyncio.timeout()`. Se declara aquí porque el
# proyecto no tiene `pyproject.toml` —de donde ruff leería `requires-python`— y
# el venv corre 3.12.
target-version = "py312"

[lint]
select = [
    "E",   # pycodestyle: errores
    "F",   # pyflakes: imports sin usar, nombres indefinidos
    "I",   # isort: orden de imports
    "UP",  # pyupgrade: sintaxis moderna
    "B",   # bugbear: patrones que suelen ser bugs
    "C4",  # comprehensions
    "DTZ", # datetimes sin zona horaria
    "RUF", # reglas propias de ruff
    "ASYNC", # llamadas bloqueantes dentro de un `async def`
]

# Sobre `ASYNC`: detecta `open()`, `time.sleep()`, `subprocess` y clientes HTTP
# síncronos dentro de funciones asíncronas — la clase de error que consiste en
# olvidar el `asyncio.to_thread` y congelar el bucle de eventos entero mientras
# dura una operación de disco o de red.
#
# Con una limitación que conviene saber: NO conoce `sqlite3`, así que el caso
# concreto del historial se le habría escapado. Se activa igualmente porque es
# gratis y cubre la familia; pero no sustituye a mirar.

# NO se selecciona `BLE` (blind-except) a propósito: capturar `Exception` en las
# fronteras de integración es DELIBERADO, y es lo que sostiene el aislamiento de
# fallos de todo el sistema (ToolResult.fail, gather(return_exceptions=True)).
# Una señal caída no puede tumbar a las demás, y para eso hay que
# capturar lo que sea que lance el proveedor.

ignore = [
    # El formateador ya mantiene el CÓDIGO dentro del ancho; lo que no puede
    # partir son literales y prosa. Aquí E501 sólo salta en payloads simulados
    # de los tests (hasta 196 caracteres) y en comentarios: reescribirlos a mano
    # es puro trasiego sin ganancia.
    "E501",

    # Detectan homoglifos (cirílico disfrazado de latino). Aquí sólo saltan por
    # comillas tipográficas (’ “ —) en texto español e inglés perfectamente
    # legítimo.
    "RUF001",
    "RUF002",
    "RUF003",

    # Sugiere cambiar `class X(str, Enum)` por `enum.StrEnum` en los ocho enums
    # del contrato. NO es un cambio cosmético: con el mixin `str, Enum`,
    # `str(Dimension.FORMA)` devuelve `'Dimension.FORMA'`, y con `StrEnum`
    # devuelve `'forma'`. Cualquier sitio que interpole el enum en una cadena
    # cambiaría de salida en silencio.
    #
    # Se silencia AQUÍ y no se aplica al vuelo porque exige repasar los puntos de
    # uso —serialización, logs, f-strings— y eso es una tarea con su propio
    # riesgo, no un arreglo de paso. Va con la limpieza de #108.
    "UP042",
]

[lint.per-file-ignores]
# Los tests importan fixtures y módulos por su efecto de registro.
#
# Y ASYNC109 por lo mismo que en `core/mcp/tools.py`: los dobles que sustituyen
# a `_intentar` COPIAN su firma. Si no la copiaran, monkeypatch instalaría algo
# que no encaja y el test fallaría por el andamiaje en vez de por el código.
"tests/**" = ["F401", "ASYNC109"]

# ASYNC109 desaconseja el parámetro `timeout` en una función async, y su
# argumento es bueno: si lo único que hace la función es envolver su cuerpo en
# `asyncio.timeout`, el llamante puede hacerlo igual de bien y el parámetro
# sobra.
#
# Aquí la premisa no se cumple. El valor hace DOS trabajos con un solo número:
# acota la operación entera con `asyncio.timeout` **y** se le pasa a
# `open_session` como corte de inactividad de httpx. Ese segundo uso el llamante
# no puede reproducirlo desde fuera, así que el parámetro no es redundante.
#
# Y sale por parámetro a propósito (#137): leer `settings` aquí obligaría a
# montar un entorno para probar el mecanismo, que es la misma regla que mantiene
# limpios a los detectores NLP. Quien conoce el caso de uso elige el corte — la
# API tiene dos distintos, uno para descubrir y otro para ejecutar.
"backend/core/mcp/tools.py" = ["ASYNC109"]
