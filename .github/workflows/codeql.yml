# Análisis de vulnerabilidades de #260, frente 3: CodeQL sobre el código.
#
# Las reglas S de ruff miran líneas sueltas. CodeQL convierte el código en una
# base de datos consultable y sigue el RECORRIDO de los datos: desde una fuente
# (lo que llega de fuera: el cuerpo de una petición, un parámetro, la respuesta
# de una API) hasta un sumidero peligroso (SQL, una ruta de fichero, un proceso,
# el HTML), y sólo avisa si los une un camino sin sanear.
#
# Decidido al definir #260: UNA vez y a mano, no en cada PR. En cada PR, un
# aviso publicado hoy pondría en rojo un cambio que no ha tocado nada, y cada
# alerta pediría atención. Por eso:
#
#   - sólo `workflow_dispatch` (pestaña Actions, o `gh workflow run codeql.yml`
#     cuando el fichero esté en `dev`);
#   - `upload: never`: no sube nada a code scanning, así que no deja alertas
#     permanentes; el informe (SARIF) queda como artefacto de la ejecución, y
#     `spikes/vulnerabilidades_codeql.sh` lo descarga y lo resume.
#
# `security-extended` y no el conjunto por defecto: más consultas, algo más de
# ruido; para una auditoría que se tría a mano, mejor ver de más.
#
# Las acciones van fijadas por COMMIT, con su versión en el comentario. Una
# etiqueta se puede mover, y en marzo de 2026 se reescribieron 76 de las 77 de
# `aquasecurity/trivy-action` para robar credenciales (CVE-2026-33634). Es el
# primer flujo del repositorio que lo hace; los demás siguen por etiqueta (el
# pendiente de #217).
#
# El runner va fijado a `ubuntu-24.04`, como los demás: `latest` pasa a Ubuntu
# 26 el 2026-10-19.
#
# Cómo se lanza y se lee, con el resto del análisis: `docs/desarrollo.md`, §9.
#
# Ejecuciones de las que salen las cifras del README (GitHub borra los registros
# a los 90 días; los SARIF están en `spikes/vulnerabilidades/2026-10-13-final/`):
#   - 38407160235, 2026-10-13, commit 6329213, CodeQL 2.27.2: la primera, con
#     un disparador `push` temporal a la rama de #260, quitado antes de la PR.

name: CodeQL (a mano)

on:
  workflow_dispatch:

# `security-events: read` no sube nada: deja a la acción consultar su propia
# configuración (qué versión de CodeQL usar). Sin él avisaba y usaba la que
# trae dentro; el análisis era el mismo (ejecución 38407160235).
permissions:
  contents: read
  actions: read
  security-events: read

jobs:
  codeql:
    name: CodeQL · ${{ matrix.lenguaje }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        lenguaje: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.lenguaje }}
          # Ni Python ni TypeScript necesitan compilarse para analizarse.
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.lenguaje }}
          upload: never
          output: sarif

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-${{ matrix.lenguaje }}
          path: sarif
          retention-days: 90
