name: CI

# El filtro `branches` es por rama DESTINO. Con el flujo dev->main, las PRs de
# feature apuntan a dev: si aquí solo figurara main, se mergearían sin pasar los
# tests y el CI no saltaría hasta promocionar dev->main, cuando ya es tarde.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  test:
    env: #Usar env para evadir fallo fail fast por falta de keys
      GUARDIAN_API_KEY: dummy
      NYT_API_KEY: dummy
      HF_TOKEN: dummy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5 # usando organización actions por defecto
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip #Evita instalación en cada run
      - name: Instalando dependencias...
        run: pip install -r requirements.txt
      # `--cov` sin valor: qué se mide y qué se omite está en `.coveragerc`, así
      # que el comando es el mismo aquí y en local. Va en el paso que ya existe
      # y no en uno nuevo, para no correr la suite dos veces.
      #
      # SIN `--cov-fail-under`, a propósito (#138). Un umbral el primer día
      # convierte cualquier refactor en una pelea con el porcentaje, y lo que
      # hace falta antes es mirar el número unas cuantas corridas. El informe
      # sale en el log; congelarlo es una decisión posterior y con datos.
      - name: Corriendo tests...
        run: pytest -m "not integration" --cov
      # Después de los tests a propósito: si el estilo falla, el informe de tests
      # ya se ha generado. Ruff se instala aparte y pineado —no desde
      # requirements.txt— para no meter tooling de desarrollo en las
      # dependencias de ejecución. Reglas y exclusiones, en ruff.toml.
      - name: Comprobando estilo...
        run: |
          pip install ruff==0.16.1
          ruff check .
          ruff format --check .
      # Los tipos van en un paso APARTE del estilo, y después, por lo mismo que
      # el estilo va después de los tests: cada informe se genera aunque el
      # siguiente falle. Son tres preguntas distintas y conviene poder leer las
      # tres.
      #
      # Pyright es lo que ya corre en el editor a través de Pylance, así que el
      # CI comprueba exactamente lo que ve quien escribe. Reglas y exclusiones,
      # en `pyrightconfig.json`.
      #
      # `--pythonpath` es necesario: la configuración apunta al `.venv` para el
      # trabajo local y el editor, y aquí no hay ninguno — las dependencias
      # están en el intérprete del runner, instaladas por el paso de arriba. Sin
      # esto, pyright no resuelve un solo import y produce decenas de avisos que
      # no son errores de tipos.
      #
      # Por eso el log lleva un `venv .venv subdirectory not found`: es esperado
      # y no rompe nada. Pyright valida el `venvPath` de la configuración aunque
      # la línea de órdenes lo sustituya, y quitarlo del fichero costaría 43
      # avisos en local, que es donde sí existe ese `.venv`.
      #
      # Ojo con lo que el CI NO instala: `sentence-transformers` vive en
      # `requirements-dev.txt` por arrastrar torch, así que su import no se
      # resuelve aquí y lleva un `# pyright: ignore` con el motivo escrito. Es la
      # diferencia de entorno que hace que este paso encuentre cosas que en local
      # no aparecen.
      - name: Comprobando tipos...
        run: |
          pip install pyright==1.1.411
          pyright --pythonpath $(which python)

  # El frontend va en un job APARTE y no como pasos del de Python: son cadenas
  # de herramientas independientes y así un fallo de TypeScript no oculta el
  # resultado de pytest, ni al revés. Además corren en paralelo.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `npm ci` y no `npm install`: instala EXACTAMENTE lo del lock y falla si
      # package.json y el lock no concuerdan, en vez de resolverlo por su cuenta.
      # En CI eso es lo que se quiere — que la build sea la misma que en local.
      - name: Instalando dependencias...
        run: npm ci
      # El `schema.d.ts` commiteado tiene que ser el que sale del `openapi.json`
      # commiteado. Esta es la mitad Node de la comprobación; la otra mitad —que
      # ese JSON refleje los modelos Pydantic— la hace
      # `test_el_contrato_commiteado_esta_al_dia` en el job de Python, que es
      # donde se puede importar la app.
      #
      # Va ANTES de compilar: con los tipos rancios la build puede pasar
      # igualmente y estar mintiendo. Aquí no hace falta Python, el
      # `openapi.json` ya viene en el repositorio.
      - name: Comprobando que los tipos están al día...
        run: |
          npm run gen:api
          git diff --exit-code src/app/api/schema.d.ts || {
            echo "::error::schema.d.ts no coincide con openapi.json. Corre 'npm run gen:api' en frontend/ y commitea el resultado."
            exit 1
          }
      - name: Compilando...
        run: npm run build
      # Los tests usan vitest sobre jsdom, no Karma: no hace falta navegador ni
      # instalar Chrome en el runner.
      - name: Corriendo tests...
        run: npm test
