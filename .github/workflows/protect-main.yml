# Protección del flujo dev→main: main solo acepta PRs cuyo origen sea dev.
# (GitHub no soporta nativamente restringir la rama origen de un PR; este check,
# marcado como "required" en la branch protection de main, lo hace cumplir.)
name: protect-main
on:
  pull_request:
    branches: [main]

jobs:
  # El nombre del trabajo NO se cambia: la protección de main exige el check
  # `only-from-dev` por su nombre. El runner, fijado como en ci.yml (#178).
  only-from-dev:
    runs-on: ubuntu-24.04
    steps:
      - name: Verificar que el PR viene de dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::main solo acepta merges desde dev (flujo dev->main). Rama origen: ${{ github.head_ref }}"
            exit 1
          fi
          echo "OK: PR desde dev."
