# Túnel inverso de Ollama (#181): la máquina 2 abre `ssh -R` hacia aquí.
# Sólo para el usuario `tunel`, y sólo para escuchar en 172.17.0.1:11434, que es
# la dirección del host que alcanza el contenedor de la API.
Match User tunel
    AllowTcpForwarding remote
    GatewayPorts clientspecified
    PermitListen 172.17.0.1:11434
    PermitOpen none
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    ForceCommand /usr/sbin/nologin
